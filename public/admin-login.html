
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Brightside Dental</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f6f5;
      color: #1f3d3b;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 36px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 27px;
    }

    p {
      color: #687775;
      margin-bottom: 26px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd6d3;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #1f3d3b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    #message {
      min-height: 20px;
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Brightside Dental</h1>
    <p>Admin Dashboard Login</p>

    <form id="loginForm">
      <label for="password">Admin Password</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Enter admin password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">Login</button>
      <div id="message" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script src="admin.js"></script>
</body>
</html>
